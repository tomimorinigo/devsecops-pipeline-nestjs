env:
  contexts:
    - name: tpi
      urls:
        - http://app:3000

jobs:
  - type: passiveScan-config
    parameters:
      scanOnlyInScope: true
  - type: requestor
    requests:
      - url: http://app:3000/
        responseCode: 200
      - url: http://app:3000/health
        responseCode: 200
  - type: passiveScan-wait
    parameters:
      maxDuration: 2
  - type: report
    alwaysRun: true
    parameters:
      template: traditional-json
      reportDir: /zap/wrk
      reportFile: zap-report
  - type: exitStatus
    parameters:
      errorLevel: Medium
